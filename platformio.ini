; PlatformIO Project Configuration File
;
; Raspberry Pi Pico 2 W version of Remote player, using the
; arduino-pico core (Earle Philhower) via the community PlatformIO platform.
; https://docs.platformio.org/page/projectconf.html

[env:rpipico2w]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
; Settings are stored on LittleFS, and OTA updates are staged there before
; installing, so the file system must be larger than the firmware image.
board_build.filesystem_size = 1.5m
monitor_speed = 115200
; The core optimizes for size (-Os) by default. Decoding MP3 on four units at once needs the
; speed of -O2; flash has plenty of room for the larger code.
build_unflags = -Os
build_flags = -O2
; Runs the MP3 decoder from RAM instead of flash; see the script for why.
extra_scripts = post:helix_in_ram.py
lib_deps =
    knolleary/PubSubClient@^2.8
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.2.6
    https://github.com/pschatzmann/arduino-libhelix.git#v.0.8.4
    adafruit/Adafruit SSD1306@^2.5.17

; The first upload must go over USB (hold BOOTSEL while plugging in if needed).
; After that, set an OTA password on the settings page (OTA updates are off without one) and
; uncomment these lines to upload over WiFi, with your hostname and OTA password
; (the platform uses OTA port 2040):
;upload_protocol = espota
;upload_port = remote-player.local
;upload_flags =
;    --auth=YOUR_OTA_PASSWORD